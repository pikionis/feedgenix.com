; FeedGenix's own PHP-FPM master, run by the feedgenix user (ADR 0011). Managed by ops/provision.sh.
; Reloading it never touches another application's pool, and the deploy receiver (also feedgenix)
; can reload it gracefully without sudo.

[global]
pid = ${FG_PHP_SOCKET_DIR}/php-fpm.pid
error_log = syslog
syslog.ident = feedgenix-php
log_level = notice
; a graceful reload (USR2) lets running requests finish first
process_control_timeout = 20s
emergency_restart_threshold = 10
emergency_restart_interval = 1m
daemonize = no

[feedgenix]
; 0666, but inside ${FG_PHP_SOCKET_DIR} (0710 feedgenix:${FG_NGINX_GROUP}): only nginx can reach it
listen = ${FG_PHP_SOCKET_DIR}/php-fpm.sock
listen.mode = 0666
listen.backlog = 511

pm = dynamic
pm.max_children = ${FG_FPM_MAX_CHILDREN}
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000
request_terminate_timeout = 120s

catch_workers_output = yes
decorate_workers_output = no
clear_env = yes
security.limit_extensions = .php

php_admin_value[open_basedir] = ${FG_ROOT}/releases/:${FG_ROOT}/shared/:/tmp/:/usr/share/zoneinfo/
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
