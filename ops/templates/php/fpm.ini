; FeedGenix overrides for its own PHP-FPM master, read after the system's conf.d through
; PHP_INI_SCAN_DIR. Managed by ops/provision.sh.
expose_php = Off
memory_limit = 256M
max_execution_time = 60
max_input_time = 60
upload_max_filesize = 64M
post_max_size = 64M
date.timezone = UTC
display_errors = Off
log_errors = On
allow_url_include = Off
session.use_strict_mode = 1

; No shell-outs from a web request: long or external work belongs in the queue workers.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec

opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; A release never changes in place: every deploy is a new directory, and the master reloads.
opcache.validate_timestamps = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600
