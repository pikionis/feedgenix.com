# FeedGenix's private Redis: run by the feedgenix user, unix socket only. Managed by
# ops/provision.sh. The queue lives here, so nothing is ever evicted.
port 0
unixsocket /run/feedgenix-redis/redis.sock
unixsocketperm 700
protected-mode yes

supervised systemd
daemonize no
logfile ""
loglevel notice
databases 4

dir /var/lib/feedgenix-redis
dbfilename dump.rdb
save 900 1 300 10 60 10000
appendonly yes
appendfsync everysec

maxmemory 512mb
maxmemory-policy noeviction

# Redis 7 defaults, stated: no runtime change of dir/dbfilename, no DEBUG, no MODULE.
enable-protected-configs no
enable-debug-command no
enable-module-command no
