# FeedGenix: conf.d of cluster 18/main. Managed by ops/provision.sh.

# The unix socket only: nothing listens on the network. The app connects with peer authentication.
listen_addresses = ''
timezone = 'UTC'
log_timezone = 'UTC'
password_encryption = scram-sha-256

# Sized for ${FG_MODE} mode.
shared_buffers = ${FG_PG_SHARED_BUFFERS}
effective_cache_size = ${FG_PG_EFFECTIVE_CACHE_SIZE}
work_mem = 16MB
maintenance_work_mem = 256MB
max_connections = 100

log_min_duration_statement = 1000
log_line_prefix = '%m [%p] %q%u@%d '
