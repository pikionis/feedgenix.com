# FeedGenix sandbox, applied to every feedgenix-*.service through systemd's "feedgenix-" prefix
# drop-in directory (feedgenix-.service.d/). Managed by ops/provision.sh. ADR 0011.
[Service]
Slice=feedgenix.slice
UMask=0027
NoNewPrivileges=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectSystem=full
ProtectHome=yes
ProtectProc=invisible
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
LockPersonality=yes
SystemCallArchitectures=native

# Other applications' files, sockets and data do not exist in here.
InaccessiblePaths=${FG_INACCESSIBLE_PATHS}

# No TCP to anything on this host (another app's Redis or MySQL, admin ports), only DNS through
# systemd-resolved. PostgreSQL and Redis are reached over unix sockets.
IPAddressDeny=localhost ${FG_HOST_ADDRESSES}
IPAddressAllow=127.0.0.53/32
