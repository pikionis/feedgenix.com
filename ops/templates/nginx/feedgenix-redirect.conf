
# The other names (--redirect-from): a permanent redirect to https://${FG_DOMAIN}, path and query kept,
# so an old link or a feed URL a sales channel already pulls keeps working. Appended to the vhost
# only when there are such names.
server {
    listen 443 ssl${FG_HTTP2_LISTEN};
    ${FG_IPV6_LISTEN_443}
    ${FG_HTTP2_DIRECTIVE}
    server_name ${FG_REDIRECT_HOSTS};

    ssl_certificate ${FG_TLS_CERT};
    ssl_certificate_key ${FG_TLS_KEY};
    server_tokens off;

    access_log /var/log/nginx/feedgenix.access.log;
    error_log /var/log/nginx/feedgenix.error.log warn;

    include /etc/nginx/snippets/feedgenix-headers.conf;

    location / {
        return 301 https://${FG_DOMAIN}$request_uri;
    }
}
