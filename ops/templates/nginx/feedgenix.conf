# FeedGenix: ${FG_DOMAIN}. Managed by ops/provision.sh; edits here are overwritten.
# TLS terminates here (no Varnish). The SPA is static files; /api, /sanctum, /auth, /up and the feed
# URLs (/f/) go to Laravel on FeedGenix's own PHP-FPM.

server {
    listen 80;
    ${FG_IPV6_LISTEN_80}
    # The site's own name and every name that redirects to it (--redirect-from).
    server_name ${FG_SERVER_NAMES};

    # Let's Encrypt HTTP-01 (certbot certonly --webroot).
    location ^~ /.well-known/acme-challenge/ {
        root ${FG_ACME_ROOT};
        default_type text/plain;
    }

    location / {
        return 301 https://${FG_DOMAIN}$request_uri;
    }
}

server {
    listen 443 ssl${FG_HTTP2_LISTEN};
    ${FG_IPV6_LISTEN_443}
    ${FG_HTTP2_DIRECTIVE}
    server_name ${FG_DOMAIN};

    ssl_certificate ${FG_TLS_CERT};
    ssl_certificate_key ${FG_TLS_KEY};

    root ${FG_ROOT}/current/frontend/build/client;
    # A release switch must show at once: never cache resolved paths.
    open_file_cache off;
    server_tokens off;
    client_max_body_size 64m;
    charset utf-8;

    access_log /var/log/nginx/feedgenix.access.log;
    error_log /var/log/nginx/feedgenix.error.log warn;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/snippets/feedgenix-headers.conf;

    location = /robots.txt {
        default_type text/plain;
        return 200 "${FG_ROBOTS_TXT}";
    }

    # Laravel: the API, Sanctum's CSRF cookie, Google sign-in redirects and the health route.
    location ~ ^/(api|sanctum|auth)/ {
        include /etc/nginx/snippets/feedgenix-php.conf;
    }

    location = /up {
        include /etc/nginx/snippets/feedgenix-php.conf;
    }

    # Feed URLs that sales channels pull (ADR 0007): Laravel checks the token and serves the build.
    location ^~ /f/ {
        include /etc/nginx/snippets/feedgenix-php.conf;
    }

    # Hashed build assets never change.
    location ^~ /assets/ {
        include /etc/nginx/snippets/feedgenix-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The pre-rendered home page.
    location = / {
        include /etc/nginx/snippets/feedgenix-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # Everything else: a file from the build, or the SPA shell for the app's routes.
    location / {
        include /etc/nginx/snippets/feedgenix-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /__spa-fallback.html;
    }
}
