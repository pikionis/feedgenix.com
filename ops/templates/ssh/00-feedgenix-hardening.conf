# FeedGenix dedicated server: key-only SSH. Managed by ops/provision.sh, installed only after it has
# checked that the administrator has an authorized key. sshd keeps the first value it reads, and
# this file sorts first in sshd_config.d.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
PermitEmptyPasswords no
X11Forwarding no
MaxAuthTries 4
