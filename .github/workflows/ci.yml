name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per branch: a newer push cancels the older run (private-repo minutes are limited).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'
  PHP_EXTENSIONS: pdo_pgsql, pgsql, intl, zip, redis
  NODE_VERSION: '24'
  # The app role is never SUPERUSER or BYPASSRLS, exactly as in production.
  DB_CONNECTION: pgsql
  DB_HOST: 127.0.0.1
  DB_PORT: 5432
  DB_DATABASE: feedgenix_test
  DB_USERNAME: feedgenix
  DB_PASSWORD: feedgenix

jobs:
  backend:
    name: Backend · Pint · Larastan · Rector · Pest · API contract
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Database role and extensions
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE feedgenix LOGIN PASSWORD 'feedgenix' CREATEDB NOSUPERUSER NOBYPASSRLS NOCREATEROLE;" \
            -c "CREATE DATABASE feedgenix_test OWNER feedgenix;"
          # pgvector is not a trusted extension: create it in template1 so every parallel test database has it.
          psql -h 127.0.0.1 -U postgres -d template1 -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - run: cp .env.example .env && php artisan key:generate --ansi

      - run: composer lint
      - run: composer analyse
      - run: composer refactor:check

      - name: Migrations up, down, up
        run: php artisan migrate --force && php artisan migrate:rollback --force && php artisan migrate --force

      # The SFTP connector is proven against a real server, on 127.0.0.1 only.
      - name: SFTP server for the connector tests
        run: bash tests/Support/fixtures/start-sftp.sh

      - run: composer test

      - run: composer audit

      # The API contract must be current: re-export the OpenAPI document, regenerate the
      # TypeScript types and fail if either differs from what is committed.
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: composer api:export
      - run: npm ci && npm run api:types
        working-directory: frontend
      - run: git diff --exit-code -- frontend/openapi.json frontend/src/lib/api/schema.d.ts

  frontend:
    name: Frontend · tsc · oxlint · Prettier · Vitest · build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end · Playwright (fake AI)
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2
      - uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Database role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE feedgenix LOGIN PASSWORD 'feedgenix' CREATEDB NOSUPERUSER NOBYPASSRLS NOCREATEROLE;" \
            -c "CREATE DATABASE feedgenix_test OWNER feedgenix;"
      - run: cp .env.example .env && php artisan key:generate --ansi && php artisan migrate --force

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  secrets:
    name: Secret scan · gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
