<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.sw{border:.5px solid rgba(31,29,46,.1);border-radius:10px;overflow:hidden}
.chip{height:72px}
.meta{padding:10px 12px;font-size:11px;line-height:1.4}
.name{color:#1F1D2E;font-weight:500;letter-spacing:-0.01em;display:block;font-size:13px}
.hex{color:#7A7790;font-family:var(--font-mono);font-size:11px;display:block;margin-top:2px}
</style></head><body>
<div class="grid">
  <div class="sw"><div class="chip" style="background:#4F46E5"></div><div class="meta"><span class="name">Indigo</span><span class="hex">#4F46E5</span></div></div>
  <div class="sw"><div class="chip" style="background:#0F9B7E"></div><div class="meta"><span class="name">Emerald</span><span class="hex">#0F9B7E</span></div></div>
  <div class="sw"><div class="chip" style="background:#1F1D2E"></div><div class="meta"><span class="name">Ink</span><span class="hex">#1F1D2E</span></div></div>
  <div class="sw"><div class="chip" style="background:#FAEEDA"></div><div class="meta"><span class="name">Sand</span><span class="hex">#FAEEDA</span></div></div>
  <div class="sw"><div class="chip" style="background:#F1EFE8"></div><div class="meta"><span class="name">Mist</span><span class="hex">#F1EFE8</span></div></div>
  <div class="sw"><div class="chip" style="background:#FFFFFF;border-bottom:.5px solid rgba(31,29,46,.1)"></div><div class="meta"><span class="name">Paper</span><span class="hex">#FFFFFF</span></div></div>
</div>
</body></html>
