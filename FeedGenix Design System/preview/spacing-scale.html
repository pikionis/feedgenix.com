<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);color:#1F1D2E}
.row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar{background:#4F46E5;height:14px;border-radius:3px}
.lbl{font-family:var(--font-mono);font-size:11px;color:#7A7790;width:70px}
.val{font-family:var(--font-mono);font-size:11px;color:#1F1D2E;margin-left:8px}
</style></head><body>
<div class="row"><span class="lbl">s-1</span><div class="bar" style="width:4px"></div><span class="val">4</span></div>
<div class="row"><span class="lbl">s-2</span><div class="bar" style="width:8px"></div><span class="val">8</span></div>
<div class="row"><span class="lbl">s-3</span><div class="bar" style="width:12px"></div><span class="val">12</span></div>
<div class="row"><span class="lbl">s-4</span><div class="bar" style="width:16px"></div><span class="val">16</span></div>
<div class="row"><span class="lbl">s-6</span><div class="bar" style="width:24px"></div><span class="val">24</span></div>
<div class="row"><span class="lbl">s-8</span><div class="bar" style="width:32px"></div><span class="val">32</span></div>
<div class="row"><span class="lbl">s-12</span><div class="bar" style="width:48px"></div><span class="val">48</span></div>
<div class="row"><span class="lbl">s-16</span><div class="bar" style="width:64px"></div><span class="val">64</span></div>
<div class="row"><span class="lbl">s-24</span><div class="bar" style="width:96px"></div><span class="val">96</span></div>
</body></html>
