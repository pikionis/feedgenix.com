<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);display:flex;gap:14px;align-items:flex-end}
.cell{display:flex;flex-direction:column;align-items:center;gap:8px}
.box{width:84px;height:84px;background:#F1EFE8;border:.5px solid rgba(31,29,46,.1)}
.cap{font-family:var(--font-mono);font-size:11px;color:#7A7790}
.name{font-size:12px;color:#1F1D2E;font-weight:500}
</style></head><body>
<div class="cell"><div class="box" style="border-radius:4px"></div><div class="name">xs</div><div class="cap">4px · chips</div></div>
<div class="cell"><div class="box" style="border-radius:6px"></div><div class="name">sm</div><div class="cap">6px · inputs sm</div></div>
<div class="cell"><div class="box" style="border-radius:8px"></div><div class="name">md</div><div class="cap">8px · inputs / rows</div></div>
<div class="cell"><div class="box" style="border-radius:10px"></div><div class="name">lg</div><div class="cap">10px · stat cards</div></div>
<div class="cell"><div class="box" style="border-radius:12px"></div><div class="name">xl</div><div class="cap">12px · big cards</div></div>
<div class="cell"><div class="box" style="border-radius:999px;width:84px;height:32px"></div><div class="name">pill</div><div class="cap">999 · badges</div></div>
</body></html>
