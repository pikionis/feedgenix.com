<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);display:flex;justify-content:center}
.wrap{position:relative;width:240px}
.pill{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:#FAEEDA;color:#A35412;padding:5px 12px;border-radius:999px;font-size:11px;font-weight:500;letter-spacing:.04em}
.card{border:2px solid #4F46E5;border-radius:12px;padding:22px;background:#fff}
.name{font-size:13px;color:#4F46E5;font-weight:500;letter-spacing:.04em;margin-bottom:6px}
.price{font-size:36px;font-weight:500;letter-spacing:-0.02em;color:#1F1D2E;line-height:1}
.per{font-size:13px;color:#56536A;margin-top:4px}
ul{list-style:none;padding:0;margin:16px 0 0;font-size:13px;color:#1F1D2E}
li{display:flex;gap:8px;padding:4px 0}
li svg{flex-shrink:0;margin-top:3px}
.cta{margin-top:16px;width:100%;background:#4F46E5;color:#fff;border:none;padding:10px;border-radius:8px;font-family:inherit;font-weight:500;font-size:14px}
</style></head><body>
<div class="wrap">
  <span class="pill">Most popular</span>
  <div class="card">
    <div class="name">Pro</div>
    <div class="price">€99<span style="font-size:14px;color:#7A7790;font-weight:400">/mo</span></div>
    <div class="per">100K rows · unlimited languages</div>
    <ul>
      <li><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0F9B7E" stroke-width="2.25" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>API + webhooks</li>
      <li><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0F9B7E" stroke-width="2.25" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>Priority routing</li>
      <li><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0F9B7E" stroke-width="2.25" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>5 team members</li>
    </ul>
    <button class="cta">Start Pro trial</button>
  </div>
</div>
</body></html>
