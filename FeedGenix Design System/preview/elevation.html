<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:28px;background:#F1EFE8;font-family:var(--font-sans);display:flex;gap:20px;align-items:center}
.card{background:#fff;border-radius:12px;padding:16px 18px;width:180px}
.flat{border:.5px solid rgba(31,29,46,.1)}
.overlay{box-shadow:0 1px 2px rgba(31,29,46,.05),0 8px 24px rgba(31,29,46,.08)}
.tall{min-height:88px}
.name{font-weight:500;font-size:13px;color:#1F1D2E}
.meta{font-family:var(--font-mono);font-size:11px;color:#7A7790;margin-top:6px}
</style></head><body>
<div class="card flat tall"><div class="name">Flat (default)</div><div class="meta">0.5px hairline · no shadow</div></div>
<div class="card overlay tall"><div class="name">Overlay</div><div class="meta">menus, toasts only</div></div>
<div style="font-size:12px;color:#7A7790;line-height:1.5;max-width:170px">Everything is flat. Shadows are reserved for transient overlays.</div>
</body></html>
