<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:22px;background:#fff;font-family:var(--font-sans)}
.row{display:grid;grid-template-columns:40px 1.4fr 90px 220px 140px;align-items:center;gap:16px;padding:14px 16px;border:.5px solid rgba(31,29,46,.1);border-radius:10px;margin-bottom:8px}
.av{width:36px;height:36px;border-radius:8px;background:#F1EFE8;display:flex;align-items:center;justify-content:center;color:#2E2B42;font-weight:500;font-size:13px}
.name{font-weight:500;font-size:14px;color:#1F1D2E}
.file{font-family:var(--font-mono);font-size:11px;color:#7A7790;margin-top:2px}
.count{font-family:var(--font-mono);font-size:13px;color:#1F1D2E}
.flags{display:flex;gap:4px;flex-wrap:wrap}
.fp{padding:2px 8px;border-radius:999px;font-size:11px;font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:500}
.dot{width:6px;height:6px;border-radius:999px;background:currentColor}
.prog{flex:1;height:4px;background:rgba(195,122,27,.2);border-radius:999px;overflow:hidden;min-width:40px}
.prog b{display:block;width:62%;height:100%;background:#C87A1B}
</style></head><body>
<div class="row">
  <div class="av">DD</div>
  <div><div class="name">Deindeal winter catalog</div><div class="file">deindeal-2026-01.csv</div></div>
  <div class="count">12,847</div>
  <div class="flags"><span class="fp" style="background:#E7E4FA;color:#3B3490">DE</span><span class="fp" style="background:#DCEAF9;color:#1F4E87">FR</span><span class="fp" style="background:#DFF1E8;color:#0B7A63">IT</span><span class="fp" style="background:#FAE9DC;color:#A35412">EL</span></div>
  <span class="pill" style="background:#FAEEDA;color:#A35412"><span class="dot"></span>Translating<div class="prog"><b></b></div></span>
</div>
<div class="row">
  <div class="av">ZL</div>
  <div><div class="name">Zalando swiss assortment</div><div class="file">zalando-ch-week14.csv</div></div>
  <div class="count">4,210</div>
  <div class="flags"><span class="fp" style="background:#E7E4FA;color:#3B3490">DE</span><span class="fp" style="background:#DCEAF9;color:#1F4E87">FR</span></div>
  <span class="pill" style="background:#D6F1E8;color:#0B7A63"><span class="dot"></span>Synced</span>
</div>
</body></html>
