<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:20px;background:#fff;font-family:var(--font-sans)}
.bar{display:flex;align-items:center;gap:28px;padding:14px 18px;border:.5px solid rgba(31,29,46,.1);border-radius:12px}
.logo{display:flex;align-items:center;gap:8px;font-weight:500;font-size:16px;letter-spacing:-0.02em;color:#1F1D2E}
.links{display:flex;gap:22px;flex:1;margin-left:8px}
.links a{color:#56536A;font-size:14px;text-decoration:none}
.links a.active{color:#1F1D2E}
.actions{display:flex;gap:8px}
.signin{color:#1F1D2E;background:transparent;border:none;padding:8px 12px;font:inherit;font-size:14px}
.cta{background:#4F46E5;color:#fff;border:none;padding:8px 14px;border-radius:8px;font:inherit;font-weight:500;font-size:14px}
</style></head><body>
<div class="bar">
  <div class="logo">
    <svg viewBox="0 0 48 48" width="24" height="24"><rect x="6" y="14" width="22" height="3.2" rx="1.6" fill="#4F46E5"/><rect x="6" y="21.4" width="28" height="3.2" rx="1.6" fill="#4F46E5"/><rect x="6" y="28.8" width="15" height="3.2" rx="1.6" fill="#4F46E5"/><circle cx="36.5" cy="15.6" r="3.4" fill="#0F9B7E"/></svg>
    FeedGenix
  </div>
  <div class="links"><a class="active">Product</a><a>Pricing</a><a>Docs</a><a>Blog</a></div>
  <div class="actions"><button class="signin">Sign in</button><button class="cta">Start free</button></div>
</div>
</body></html>
