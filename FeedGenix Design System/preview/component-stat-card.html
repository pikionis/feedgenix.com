<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:22px;background:#F1EFE8;font-family:var(--font-sans)}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{background:#fff;border:.5px solid rgba(31,29,46,.1);border-radius:10px;padding:16px}
.lbl{font-size:12px;color:#56536A;margin-bottom:8px}
.val{font-size:26px;font-weight:500;letter-spacing:-0.01em;color:#1F1D2E;line-height:1}
.delta{display:inline-flex;align-items:center;gap:4px;margin-top:10px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px}
.up{background:#D6F1E8;color:#0B7A63}
.down{background:#D6F1E8;color:#0B7A63}
.flat{background:#EDEBE3;color:#56536A}
</style></head><body>
<div class="row">
  <div class="card"><div class="lbl">Products</div><div class="val">28,411</div><span class="delta up">↑ 412</span></div>
  <div class="card"><div class="lbl">Languages</div><div class="val">7</div><span class="delta flat">no change</span></div>
  <div class="card"><div class="lbl">Cache hit rate</div><div class="val">68%</div><span class="delta up">↑ 4 pts</span></div>
  <div class="card"><div class="lbl">Cost / 1K rows</div><div class="val">€3.40</div><span class="delta down">↓ €0.80</span></div>
</div>
</body></html>
