<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:22px;background:#fff;font-family:var(--font-sans);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:500}
.dot{width:6px;height:6px;border-radius:999px;background:currentColor}
.prog{position:relative;width:80px;height:4px;background:rgba(195,122,27,.2);border-radius:999px;overflow:hidden}
.prog b{position:absolute;inset:0;width:62%;background:#C87A1B;display:block}
.eye{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:#E0E7FF;color:#4338CA;font-size:12px;font-weight:500;letter-spacing:.04em}
.most{background:#FAEEDA;color:#A35412;padding:5px 12px;border-radius:999px;font-size:11px;font-weight:500;letter-spacing:.04em}
</style></head><body>
<span class="pill" style="background:#D6F1E8;color:#0B7A63"><span class="dot"></span>Synced</span>
<span class="pill" style="background:#FAEEDA;color:#A35412"><span class="dot"></span>Translating<div class="prog"><b></b></div></span>
<span class="pill" style="background:#EDEBE3;color:#56536A"><span class="dot"></span>Queued</span>
<span class="pill" style="background:#FCE5E1;color:#C6392A"><span class="dot"></span>Failed</span>
<span class="eye">✦ AI-native feed platform</span>
<span class="most">Most popular</span>
</body></html>
