<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:22px;background:#fff;font-family:var(--font-sans);display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:640px}
label{font-size:12px;color:#56536A;display:block;margin-bottom:6px;font-weight:500}
input,select{width:100%;box-sizing:border-box;font-family:inherit;font-size:14px;padding:10px 12px;border:.5px solid rgba(31,29,46,.14);border-radius:8px;background:#fff;color:#1F1D2E;outline:none;transition:border 120ms}
input:focus{border-color:#4F46E5;box-shadow:0 0 0 1px #4F46E5}
.field{}
.help{font-size:11px;color:#7A7790;margin-top:6px}
.search{position:relative}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#7A7790}
.search input{padding-left:32px}
</style></head><body>
<div class="field"><label>Feed name</label><input value="Deindeal winter 2026"><div class="help">Shown in the feeds list and exports</div></div>
<div class="field"><label>Source language</label><select><option>English (auto-detected)</option></select></div>
<div class="field" style="grid-column:1/-1"><label>Search</label><div class="search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input placeholder="Search feeds, jobs, translations…"></div></div>
</body></html>
