<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans)}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.sw{border:.5px solid rgba(31,29,46,.1);border-radius:10px;overflow:hidden}
.chip{height:64px}
.meta{padding:8px 10px;font-size:11px}
.name{color:#1F1D2E;font-weight:500;font-size:12px;display:block}
.hex{color:#7A7790;font-family:var(--font-mono);font-size:10px;display:block;margin-top:2px}
h3{margin:0 0 10px;font-weight:500;font-size:12px;color:#7A7790;letter-spacing:0.04em}
.section+.section{margin-top:14px}
</style></head><body>
<div class="section">
  <h3>Indigo scale</h3>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#E0E7FF"></div><div class="meta"><span class="name">Indigo 100</span><span class="hex">#E0E7FF</span></div></div>
    <div class="sw"><div class="chip" style="background:#4F46E5"></div><div class="meta"><span class="name">Indigo 500</span><span class="hex">#4F46E5</span></div></div>
    <div class="sw"><div class="chip" style="background:#4338CA"></div><div class="meta"><span class="name">Indigo 600</span><span class="hex">#4338CA</span></div></div>
    <div class="sw"><div class="chip" style="background:#D6F1E8"></div><div class="meta"><span class="name">Emerald 100</span><span class="hex">#D6F1E8</span></div></div>
    <div class="sw"><div class="chip" style="background:#0B7A63"></div><div class="meta"><span class="name">Emerald 600</span><span class="hex">#0B7A63</span></div></div>
  </div>
</div>
</body></html>
