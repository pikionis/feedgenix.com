<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button{font-family:inherit;font-weight:500;font-size:14px;border-radius:8px;padding:10px 16px;border:.5px solid transparent;cursor:pointer;transition:background 200ms cubic-bezier(.2,.6,.2,1)}
.primary{background:#4F46E5;color:#fff}
.primary:hover{background:#4338CA}
.secondary{background:#fff;color:#1F1D2E;border-color:rgba(31,29,46,.14)}
.secondary:hover{background:#F1EFE8}
.ghost{background:transparent;color:#1F1D2E}
.ghost:hover{background:#F1EFE8}
.dark{background:#1F1D2E;color:#fff}
.danger{background:#fff;color:#C6392A;border-color:#F4C7C1}
.small{padding:6px 10px;font-size:12px;border-radius:6px}
.disabled{background:#EDEBE3;color:#A6A3B8;cursor:not-allowed}
</style></head><body>
<button class="primary">Start free — 500 rows</button>
<button class="secondary">Watch 2-min demo</button>
<button class="ghost">Sign in</button>
<button class="dark">New feed</button>
<button class="danger">Cancel job</button>
<button class="primary small">Import</button>
<button class="disabled">Disabled</button>
</body></html>
