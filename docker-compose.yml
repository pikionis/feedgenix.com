services:
  postgres:
    image: postgres:16-alpine
    container_name: feedgenix-postgres
    environment:
      POSTGRES_DB: feedgenix
      POSTGRES_USER: feedgenix
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: feedgenix-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
